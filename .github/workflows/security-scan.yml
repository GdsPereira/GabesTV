name: Security Scan & Shift-Left (SAST, Secrets, Dependencies)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Executa toda segunda-feira às 06:00 UTC para detectar novas CVEs em dependências existentes
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detection
        uses: zricethezav/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

  codeql-sast:
    name: CodeQL SAST (Java-Kotlin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          queries: security-extended,security-and-quality

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug classes for CodeQL analysis
        run: ./gradlew :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          category: "/language:java-kotlin"

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Dependency Review (Pull Requests)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Run Trivy Vulnerability Scanner (Filesystem & Libraries)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: false
          format: 'sarif'
          output: 'trivy-dependency-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy SARIF Report to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-dependency-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: 'trivy-dependency-results.sarif'
          category: 'trivy-dependencies'

      - name: Upload Dependency Scan Artifact
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('trivy-dependency-results.sarif') != ''
        with:
          name: dependency-scan-results
          path: trivy-dependency-results.sarif
          retention-days: 14
