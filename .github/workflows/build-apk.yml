name: Build & Release Android TV APK

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests and Build Debug & Release APKs
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Prepare APKs for Distribution
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GabesTV-AndroidTV-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/GabesTV-AndroidTV-release.apk
          cp app/build/outputs/apk/release/app-release.apk dist/GabesTV-AndroidTV.apk

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GabesTV-AndroidTV-APKs
          path: dist/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GabesTV-AndroidTV-release.apk
            dist/GabesTV-AndroidTV-debug.apk
          name: "GabesTV Android TV ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
