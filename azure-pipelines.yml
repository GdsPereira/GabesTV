trigger:
  branches:
    include:
      - main
      - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  JAVA_VERSION: '17'

steps:
- task: JavaToolInstaller@0
  inputs:
    versionSpec: '$(JAVA_VERSION)'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'
  displayName: 'Setup JDK $(JAVA_VERSION)'

- script: |
    if [ ! -f gradlew ]; then
      echo "Generating wrapper via system gradle..."
      gradle wrapper --gradle-version 8.6
    fi
    chmod +x gradlew
    # Accept all Android SDK licenses automatically
    yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
  displayName: 'Verify gradlew and accept Android SDK licenses'

- task: Gradle@3
  inputs:
    gradleWrapperFile: 'gradlew'
    tasks: ':app:testDebugUnitTest :app:assembleDebug :app:assembleRelease'
    options: '--stacktrace'
    publishJUnitResults: true
    testResultsFiles: '**/TEST-*.xml'
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: '1.17'
    jdkArchitectureOption: 'x64'
  displayName: 'Run Unit Tests & Build Debug and Release APKs'

- task: CopyFiles@2
  inputs:
    contents: 'app/build/outputs/apk/**/*.apk'
    targetFolder: '$(Build.ArtifactStagingDirectory)'
    flattenFolders: true
  displayName: 'Copy APK to Staging Directory'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'GabesTV-AndroidTV-APK'
    publishLocation: 'Container'
  displayName: 'Publish APK Artifact'
